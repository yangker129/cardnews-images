name: 카드뉴스 렌더링

on:
  repository_dispatch:
    types: [dtf_bundle]      # Make 시나리오가 회차 묶음을 보내면 실행돼요
  workflow_dispatch:
    inputs:
      folder:
        description: "다시 렌더링할 폴더 (slides.json이 있어야 해요, 예: posts/2026-10-28)"
        required: true

permissions:
  contents: write

concurrency: render

jobs:
  render:
    runs-on: ubuntu-24.04   # 렌더링 환경 고정 (폰트·브라우저 설치가 바뀌지 않게)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 묶음 풀기
        id: unpack
        env:
          FOLDER_IN: ${{ inputs.folder }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python tools/unbundle.py
          else
            if [ ! -f "$FOLDER_IN/slides.json" ]; then echo "오류: $FOLDER_IN/slides.json이 없어요"; exit 1; fi
            echo "folder=$FOLDER_IN" >> "$GITHUB_OUTPUT"
            echo "mode=render" >> "$GITHUB_OUTPUT"
          fi
      - name: 폰트·ffmpeg·브라우저 준비
        if: steps.unpack.outputs.mode == 'render'
        timeout-minutes: 8
        run: |
          # 폰트: 저장소에 넣어 둔 Noto Sans CJK를 시스템 폰트 자리에 복사 (apt 미사용)
          sudo mkdir -p /usr/share/fonts/opentype/noto
          sudo cp assets/fonts/*.ttc /usr/share/fonts/opentype/noto/
          fc-cache -f > /dev/null
          fc-list | grep -c "Noto Sans CJK" 
          # ffmpeg: PyPI의 정적 빌드 사용 (apt 미사용)
          pip install -q playwright pillow imageio-ffmpeg
          if ! command -v ffmpeg > /dev/null; then
            sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
          # 브라우저: 러너에 필요한 라이브러리가 이미 있어서 크로미움만 받아요
          timeout 300 python -m playwright install chromium
      - name: 카드·릴스·스토리 만들기
        if: steps.unpack.outputs.mode == 'render'
        env:
          F: ${{ steps.unpack.outputs.folder }}
          BGM: assets/bgm.mp3
        run: |
          python tools/render.py "$F/slides.json"
          python tools/reel.py "$F"
          python tools/finish.py "$F"
          ls -la "$F"
      - name: 저장소에 올리기
        env:
          F: ${{ steps.unpack.outputs.folder }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A "$F"
          git commit -m "${{ steps.unpack.outputs.mode == 'cancel' && '게시 취소' || '렌더링' }}: $F" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
