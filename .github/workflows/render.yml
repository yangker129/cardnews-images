name: 카드뉴스 렌더링

on:
  repository_dispatch:
    types: [dtf_bundle]      # Make 시나리오가 회차 묶음을 보내면 실행돼요
  workflow_dispatch:
    inputs:
      folder:
        description: "다시 렌더링할 폴더 (slides.json이 있어야 해요, 예: posts/2026-10-28)"
        required: true

permissions:
  contents: write

concurrency: render

jobs:
  render:
    runs-on: ubuntu-24.04   # 렌더링 환경 고정 (폰트·브라우저 설치가 바뀌지 않게)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 묶음 풀기
        id: unpack
        env:
          FOLDER_IN: ${{ inputs.folder }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            python tools/unbundle.py
          else
            if [ ! -f "$FOLDER_IN/slides.json" ]; then echo "오류: $FOLDER_IN/slides.json이 없어요"; exit 1; fi
            echo "folder=$FOLDER_IN" >> "$GITHUB_OUTPUT"
            echo "mode=render" >> "$GITHUB_OUTPUT"
          fi
      - name: 폰트·ffmpeg·브라우저 설치
        if: steps.unpack.outputs.mode == 'render'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for i in 1 2 3; do
            sudo -E timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
            sudo -E timeout 240 apt-get install -y -qq -o Acquire::Retries=3 fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null && break
            echo "설치 재시도 $i"; sleep 10
          done
          pip install -q playwright pillow
          timeout 240 python -m playwright install --with-deps chromium > /dev/null
      - name: 카드·릴스·스토리 만들기
        if: steps.unpack.outputs.mode == 'render'
        env:
          F: ${{ steps.unpack.outputs.folder }}
          BGM: assets/bgm.mp3
        run: |
          python tools/render.py "$F/slides.json"
          python tools/reel.py "$F"
          python tools/finish.py "$F"
          ls -la "$F"
      - name: 저장소에 올리기
        env:
          F: ${{ steps.unpack.outputs.folder }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A "$F"
          git commit -m "${{ steps.unpack.outputs.mode == 'cancel' && '게시 취소' || '렌더링' }}: $F" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
